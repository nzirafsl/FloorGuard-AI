# ── Netlify config — FloodGuard AI frontend ───────────────────────────────────
[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect all routes to index.html for React client-side routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Optional: proxy /api/* to your Render backend so you never expose the URL
# Uncomment and replace the URL after you deploy to Render
# [[redirects]]
#   from   = "/api/*"
#   to     = "https://floodguard-ai.onrender.com/:splat"
#   status = 200
#   force  = true
